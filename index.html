<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قناة goudzl — لحظة بلحظة</title>
<style>
  :root {
    --bg: #0e1013;
    --panel: #161a1f;
    --line: #262b32;
    --text: #e9edf1;
    --muted: #8b93a1;
    --accent: #3fb0ff;
    --pulse: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    background: rgba(14,16,19,0.9);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
  }
  .live-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--pulse);
    box-shadow: 0 0 0 0 rgba(46,204,113,0.6);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }
  .status { color: var(--muted); font-size: 13px; }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .post {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .post-text {
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 15.5px;
  }
  .post img, .post video {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
    display: block;
  }
  .post-meta {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="live-dot"></span> goudzl</div>
  <div class="status" id="status">بيتحدث تلقائي…</div>
</header>

<main id="feed">
  <div class="empty">لسه مفيش بوستات ظاهرة. أول بوست ينزل في القناة هيظهر هنا فورًا.</div>
</main>

<script>
  const FEED = document.getElementById('feed');
  const STATUS = document.getElementById('status');
  let knownIds = new Set();

  function renderPost(p) {
    const div = document.createElement('div');
    div.className = 'post';
    let html = '';
    if (p.text) html += `<div class="post-text"></div>`;
    if (p.media_url && p.media_type === 'photo') {
      html += `<img src="${p.media_url}" loading="lazy">`;
    } else if (p.media_url && (p.media_type === 'video' || p.media_type === 'animation')) {
      html += `<video src="${p.media_url}" controls></video>`;
    }
    const d = new Date(p.date * 1000);
    html += `<div class="post-meta">${d.toLocaleString('ar-EG')}</div>`;
    div.innerHTML = html;
    if (p.text) div.querySelector('.post-text').textContent = p.text;
    return div;
  }

  async function fetchPosts() {
    try {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      STATUS.textContent = 'متصل — بيتحدث تلقائي';

      const newOnes = posts.filter(p => !knownIds.has(p.id));
      if (newOnes.length === 0) return;

      if (knownIds.size === 0) FEED.innerHTML = '';

      // الأحدث فوق
      newOnes.sort((a, b) => b.date - a.date).forEach(p => {
        knownIds.add(p.id);
        FEED.prepend(renderPost(p));
      });
    } catch (e) {
      STATUS.textContent = 'في مشكلة اتصال، هيحاول تاني…';
    }
  }

  fetchPosts();
  setInterval(fetchPosts, 4000); // كل 4 ثواني بيشيك على بوستات جديدة
</script>

</body>
</html>
